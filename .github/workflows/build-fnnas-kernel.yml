#==========================================================================
# Firefly AIO-3568J (RK3568J) —— 自编 FnNAS 6.18.y 内核包
#
# 流程：kernel 源码 → 基线 config + 本板片段 → 编 Image/modules/dtbs
#       → 打 deb（bindeb-pkg，失败时自动放宽 debhelper-compat 重试）
#       → ophub/fnnas 的 rekernel 封装成 <ver>-rockchip.tar.gz
#       → 校验 + 发 Release(kernel_fnnas)；日志打包发 Release(build-logs)
#==========================================================================

name: Build FnNAS Kernel (self-built) for AIO-3568J

on:
  push:
    paths:
      - '.github/workflows/build-fnnas-kernel.yml'
      - 'dts/**'
      - 'config/**'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核源码版本（默认 6.18.63）"
        required: true
        default: "6.18.63"
      dtbs_version:
        description: "内核系列（决定官方 dtbs/deb 匹配）"
        required: true
        default: "6.18.y"
      fnnas_base_version:
        description: "FnNAS 官方基础镜像（RK3568 用 rockchip_1253）"
        required: true
        default: "rockchip_1253"
        type: choice
        options:
          - rockchip_1253
          - rockchip_692

env:
  TZ: Etc/UTC
  DTB_NAME: rk3568-firefly-aioj
  KVER: ${{ inputs.kernel_version || '6.18.63' }}
  SERIES: ${{ inputs.dtbs_version || '6.18.y' }}
  LOG_DIR: /builder/logs

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          # ophub 官方依赖集
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-make-fnnas-depends)
          # 额外：deb 打包依赖（bindeb-pkg 的 dpkg-checkbuilddeps 需要）
          #   debhelper -> 提供 debhelper-compat (= 12)
          #   libdw-dev -> libdw-dev:native
          #   dwarves   -> pahole，BTF 生成
          sudo apt-get -y install debhelper libdw-dev dwarves libelf-dev \
            device-tree-compiler dpkg-dev fakeroot zstd bc bison flex libssl-dev
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          date -u
          echo "nproc=$(nproc)"
          command -v pahole || echo "warn: pahole missing"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder "${LOG_DIR}"
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Fetch kernel source and prepare config
        id: prep
        working-directory: /builder
        run: |
          set -eo pipefail
          mkdir -p "${LOG_DIR}"
          LOG="${LOG_DIR}/01-prep.log"
          MIRROR_CN="https://mirrors.tuna.tsinghua.edu.cn/kernel/v6.x"
          MIRROR_ORG="https://cdn.kernel.org/pub/linux/kernel/v6.x"

          for m in "${MIRROR_CN}" "${MIRROR_ORG}"; do
            echo "Downloading linux-${KVER}.tar.xz from ${m}" | tee -a "${LOG}"
            if curl -fsSL --retry 3 --retry-delay 5 "${m}/linux-${KVER}.tar.xz" -o "linux-${KVER}.tar.xz" 2>&1 | tee -a "${LOG}"; then
              break
            fi
          done
          [[ -s "linux-${KVER}.tar.xz" ]] || { echo "Error: kernel source download failed."; exit 1; }
          tar -xf "linux-${KVER}.tar.xz" 2>&1 | tail -3 | tee -a "${LOG}"
          cd "linux-${KVER}"

          base_cfg="${{ github.workspace }}/config/config-${KVER}-ophub"
          if [[ -f "${base_cfg}" ]]; then
            cp -f "${base_cfg}" .config
            echo "Use repo baseline config: ${base_cfg}" | tee -a "${LOG}"
          else
            echo "Baseline config not in repo, downloading from ophub/kernel..." | tee -a "${LOG}"
            curl -fsSL --retry 5 \
              "https://github.com/ophub/kernel/releases/download/kernel_stable/${KVER}.tar.gz" \
              -o "/builder/ophub-${KVER}.tar.gz" 2>&1 | tail -3 | tee -a "${LOG}"
            mkdir -p /builder/ophub-kernel && tar -xf "/builder/ophub-${KVER}.tar.gz" -C /builder/ophub-kernel
            boot_tar="$(find /builder/ophub-kernel -maxdepth 3 -name "boot-${KVER}-ophub.tar.gz" | head -1)"
            [[ -n "${boot_tar}" ]] || { echo "Error: ophub boot package not found."; exit 1; }
            mkdir -p /builder/ophub-boot && tar -xf "${boot_tar}" -C /builder/ophub-boot
            cp -f "/builder/ophub-boot/config-${KVER}-ophub" .config
          fi

          scripts/kconfig/merge_config.sh -m -O . .config "${{ github.workspace }}/config/aioj.fragment" 2>&1 | tee -a "${LOG}" | tail -20
          make ARCH=arm64 olddefconfig 2>&1 | tail -5 | tee -a "${LOG}"

          {
            echo "==== 关键 config 生效情况 ===="
            for k in CONFIG_LOCALVERSION CONFIG_DRM_ROCKCHIP CONFIG_DRM_PANEL_ILITEK_ILI9881C \
                     CONFIG_DRM_PANEL_SIMPLE CONFIG_TOUCHSCREEN_GOODIX CONFIG_USB_RTL8152 \
                     CONFIG_USB_NET_AX8817X CONFIG_USB_NET_CDC_MBIM CONFIG_USB_NET_QMI_WWAN \
                     CONFIG_USB_SERIAL_OPTION CONFIG_CAN_MCP251X CONFIG_DRM_DW_MIPI_DSI; do
              printf "%-40s %s\n" "${k}" "$(grep -E "^${k}=" .config || echo '(unset)')"
            done
          } | tee -a "${LOG}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Add board-specific DTS into kernel tree
        id: dts
        working-directory: /builder
        run: |
          set -e
          cd "linux-${KVER}"
          cp "${{ github.workspace }}/dts/${DTB_NAME}.dts" "arch/arm64/boot/dts/rockchip/${DTB_NAME}.dts"
          grep -q "${DTB_NAME}.dtb" arch/arm64/boot/dts/rockchip/Makefile || \
            echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += ${DTB_NAME}.dtb" >> arch/arm64/boot/dts/rockchip/Makefile
          tail -3 arch/arm64/boot/dts/rockchip/Makefile | tee -a "${LOG_DIR}/02-dts.log"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Build kernel, modules and dtbs
        working-directory: /builder/linux-${{ inputs.kernel_version || '6.18.63' }}
        run: |
          set -eo pipefail
          LOG="${LOG_DIR}/03-build.log"
          make ARCH=arm64 -j"$(nproc)" Image modules dtbs 2>&1 | tee "${LOG}" | tail -40
          ls -lh arch/arm64/boot/Image | tee -a "${LOG}"
          find arch/arm64/boot/dts -name "${DTB_NAME}.dtb" -exec ls -lh {} \; | tee -a "${LOG}"

      - name: Package kernel as deb
        working-directory: /builder/linux-${{ inputs.kernel_version || '6.18.63' }}
        run: |
          set -eo pipefail
          LOG="${LOG_DIR}/04-deb.log"
          echo "==== bindeb-pkg ====" | tee "${LOG}"
          if make ARCH=arm64 bindeb-pkg KDEB_PKGVERSION="${KVER}-ophub-1" 2>&1 | tee -a "${LOG}" | tail -40; then
            echo "bindeb-pkg ok" | tee -a "${LOG}"
          else
            echo "!! bindeb-pkg failed, relaxing debhelper-compat and retrying dpkg-buildpackage" | tee -a "${LOG}"
            if [[ -f debian/control ]]; then
              sed -i -E 's/debhelper-compat \(= [0-9]+\)/debhelper-compat (= 13)/' debian/control
              grep -n "debhelper" debian/control | tee -a "${LOG}"
            fi
            dpkg-buildpackage --build=binary --no-pre-clean --unsigned-changes \
              -R'make -f debian/rules' -j"$(nproc)" -a"$(cat debian/arch)" 2>&1 | tee -a "${LOG}" | tail -40
          fi
          ls -lh /builder/*.deb | tee -a "${LOG}"

      - name: Clone packaging scripts and download FnNAS image
        id: pack_prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          LOG="${LOG_DIR}/05-packprep.log"
          git clone --depth 1 https://github.com/ophub/fnnas.git fnnas-src 2>&1 | tail -3 | tee "${LOG}"
          cd fnnas-src
          mkdir -p fnnas-arm64 fnnas-debs/rockchip fnnas-dtbs/rockchip

          board="${{ inputs.fnnas_base_version || 'rockchip_1253' }}"
          latest=$(curl -s -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/ophub/fnnas/releases?per_page=20" | \
              jq -r --arg RTK "fnnas_base_image" --arg BOARD "${board}" \
              '[.[] | select(.tag_name | contains($RTK))] |
               map(.assets[] | select(.name | contains($BOARD) and endswith(".img.xz"))) |
               sort_by(.updated_at) | reverse | .[0] | {url: .url, name: .name}')
          [[ -z "${latest}" || "${latest}" == "null" ]] && { echo "Error: cannot resolve FnNAS image."; exit 1; }
          img_url="$(echo "${latest}" | jq -r '.url')"
          img_name="$(echo "${latest}" | jq -r '.name')"
          echo "image: ${img_name}" | tee -a "${LOG}"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" \
            "${img_url}" -o "fnnas-arm64/${img_name}" 2>&1 | tail -3 | tee -a "${LOG}"
          # rekernel 只查找 *.img，这里必须把 .img.xz 解压成 .img
          if [[ "${img_name}" == *.xz ]]; then
            echo "decompressing ${img_name} -> .img" | tee -a "${LOG}"
            xz -d -T0 "fnnas-arm64/${img_name}" 2>&1 | tail -3 | tee -a "${LOG}"
          fi
          ls -lh fnnas-arm64/ | tee -a "${LOG}"
          ls fnnas-arm64/*.img >/dev/null 2>&1 || { echo "Error: no .img for rekernel."; exit 1; }
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Inject self-built debs and DTB, patch rekernel
        id: inject
        run: |
          set -eo pipefail
          LOG="${LOG_DIR}/06-inject.log"
          cd fnnas-src
          cp -f /builder/linux-image-*.deb fnnas-debs/rockchip/
          rm -f fnnas-debs/rockchip/*-dbg_*.deb
          cp -f /builder/linux-headers-*.deb fnnas-debs/rockchip/ 2>/dev/null || true
          touch fnnas-debs/.self_built
          cp -f "${{ github.workspace }}/prebuilt/${DTB_NAME}.dtb" fnnas-dtbs/rockchip/ 2>/dev/null || true
          ls -l fnnas-debs/rockchip/ | tee "${LOG}"
          python3 "${{ github.workspace }}/scripts/patch-rekernel.py" rekernel 2>&1 | tee -a "${LOG}"
          grep -n -A3 "Self-built debs detected" rekernel | tee -a "${LOG}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Compile FnNAS kernel package
        id: rekernel
        working-directory: ${{ github.workspace }}/fnnas-src
        run: |
          set -eo pipefail
          LOG="${LOG_DIR}/07-rekernel.log"
          sudo ./rekernel -r "${{ github.repository }}" -e rockchip -t true -k "${SERIES}" 2>&1 | tee "${LOG}" | tail -90
          ls -lh fnnas/out/ | tee -a "${LOG}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Verify kernel package contents
        id: verify
        if: ${{ always() }}
        run: |
          LOG="${LOG_DIR}/08-verify.log"
          out="${{ github.workspace }}/fnnas-src/fnnas/out"
          set +e
          {
            echo "==== verify ===="
            ls -lh "${out}" 2>/dev/null
            pkg="$(ls "${out}"/*-rockchip.tar.gz 2>/dev/null | head -1)"
            if [[ -n "${pkg}" ]]; then
              rm -rf /tmp/chk && mkdir -p /tmp/chk
              tar -xf "${pkg}" -C /tmp/chk
              dtbtar="$(find /tmp/chk -name 'dtb-rockchip-*.tar.gz' | head -1)"
              if tar -tzf "${dtbtar}" | grep -qx "${DTB_NAME}.dtb"; then
                echo "OK: ${DTB_NAME}.dtb included"
              else
                echo "ERROR: ${DTB_NAME}.dtb missing"
              fi
              boottar="$(find /tmp/chk -name 'boot-rockchip-*.tar.gz' | head -1)"
              mkdir -p /tmp/chk/boot && tar -xzf "${boottar}" -C /tmp/chk/boot
              cfg="$(ls /tmp/chk/boot/config-* 2>/dev/null | head -1)"
              echo "---- 生效的关键 config ----"
              grep -E "^CONFIG_(DRM_ROCKCHIP|DRM_PANEL_ILITEK_ILI9881C|TOUCHSCREEN_GOODIX|USB_RTL8152|USB_NET_AX8817X|LOCALVERSION)=" "${cfg}"
              echo "---- boot 包内容 ----"
              ls /tmp/chk/boot | head -20
            else
              echo "no tar.gz produced"
            fi
          } 2>&1 | tee "${LOG}"

      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.verify.outputs.status == 'success' && !cancelled() }}
        with:
          tag: kernel_fnnas
          artifacts: ${{ github.workspace }}/fnnas-src/fnnas/out/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - 自编 FnNAS 内核（Linux ${{ inputs.kernel_version || '6.18.63' }}），专为 Firefly AIO-3568J (RK3568J)：
              含本板专属设备树 `rk3568-firefly-aioj.dtb`；MIPI 屏(ILI9881C)、触摸(GT911)、
              百兆 USB 网卡(RTL8152/AX8817X) 已内建。
            - Self-built FnNAS kernel for Firefly AIO-3568J with board-specific DTB.

      # 无论成败都打包日志发到公开 Release(tag: build-logs)，
      # 这样在拿不到 Actions 日志（未登录不可见）时也能用附件排错。
      - name: Bundle build logs
        if: ${{ always() }}
        run: |
          mkdir -p "${LOG_DIR}"
          {
            echo "run_id: ${{ github.run_id }}"
            echo "job_status: ${{ job.status }}"
            echo "kernel: ${KVER}  series: ${SERIES}"
            echo "dtb: ${DTB_NAME}"
            echo
            ls -lh "${LOG_DIR}" || true
          } > "${LOG_DIR}/00-summary.txt"
          ( cd "${LOG_DIR}" && tar -czf /builder/build-logs.tar.gz . ) || true
          ls -lh /builder/build-logs.tar.gz || true

      - name: Publish build logs
        if: ${{ always() && !cancelled() }}
        uses: ophub/upload-to-releases@main
        with:
          tag: build-logs
          artifacts: /builder/build-logs.tar.gz
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - Build logs of run ${{ github.run_id }} (status: ${{ job.status }}).
